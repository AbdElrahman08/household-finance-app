name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore signing key (only if the repo secrets exist)
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > release.jks; fi
      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "HouseholdFinance-1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: household-finance-apk
          path: HouseholdFinance-*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v1.0.${{ github.run_number }}" HouseholdFinance-*.apk
          --title "Household Finance 1.0.${{ github.run_number }}"
          --notes "Download the APK below and open it on your Android phone to install."
